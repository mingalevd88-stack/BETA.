<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#030405"><title>BETA · объединённый тестовый билд</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030405;color:#edf2f8;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
#player-frame,#liquid-frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#030405}
#liquid-frame[hidden],#player-frame[hidden],#back[hidden]{display:none!important}
#back{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:12px;z-index:20;display:flex;align-items:center;gap:8px;min-height:39px;border:1px solid #6b81968c;border-radius:999px;background:#111923ea;box-shadow:0 10px 24px #000a,inset 0 1px 0 #ffffff17;color:#edf3f7;padding:8px 14px;backdrop-filter:blur(20px);font:600 12px system-ui;cursor:pointer}
#back span{font-size:23px;line-height:14px;margin-top:-3px}
</style></head>
<body>
<iframe id="player-frame" src="../docs/index.html" title="BETA · плеер, профиль и персонализация" allow="autoplay; fullscreen"></iframe>
<iframe id="liquid-frame" title="BETA · три 3D-ядра Liquid" hidden allow="autoplay; fullscreen"></iframe>
<button id="back" type="button" hidden aria-label="Вернуться на главный экран"><span aria-hidden="true">‹</span> На главную</button>
<script>
(function(){
 'use strict';
 const player=document.getElementById('player-frame'),liquid=document.getElementById('liquid-frame'),back=document.getElementById('back');
 function showLiquid(){player.hidden=true;liquid.hidden=false;back.hidden=false;if(!liquid.getAttribute('src'))liquid.src='liquid.html';}
 function showPlayer(){liquid.hidden=true;liquid.removeAttribute('src');back.hidden=true;player.hidden=false;
  try{const doc=player.contentDocument;const home=doc.querySelector('#bottomnav [data-action="nav"][data-view="home"]')||doc.querySelector('.nav [data-action="nav"][data-view="home"]');if(home)home.click();}catch(e){console.warn('BETA navigation',e)}
 }
 back.addEventListener('click',showPlayer);
 function addWorldEntry(){
  try{
   const doc=player.contentDocument;if(!doc)return;
   const box=doc.querySelector('.hero .hero-buttons');if(!box||box.querySelector('[data-beta-open-world]'))return;
   const button=doc.createElement('button');button.type='button';button.className='secondary';button.dataset.betaOpenWorld='1';button.textContent='✦ Открыть мой мир';button.setAttribute('aria-label','Открыть три 3D-ядра Liquid');
   box.append(button);
  }catch(e){console.warn('BETA world entry',e)}
 }
 player.addEventListener('load',()=>{
  try{
   const doc=player.contentDocument;
   doc.addEventListener('click',event=>{const el=event.target;if(el&&el.closest&&el.closest('[data-beta-open-world]')){event.preventDefault();event.stopPropagation();event.stopImmediatePropagation();showLiquid();}},true);
   new MutationObserver(addWorldEntry).observe(doc.getElementById('main')||doc.body,{subtree:true,childList:true});
   addWorldEntry();
  }catch(e){console.error('BETA integration',e)}
 });
 window.__betaIntegration=()=>({screen:liquid.hidden?'player':'liquid',playerReady:!!player.contentWindow?.__betaPlayerDebug,liquidReady:!!liquid.contentWindow?.__betaV40,selected:!!localStorage.getItem('beta.liquid.selection.v1')});
})();
</script></body></html>
