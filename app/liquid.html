const PREVIEW_SECONDS=9;
let clipTimer=null,clipStarted=0,currentPreview=null,previewToken=0,playbackGeneration=0,jsonpSequence=0,activeArtistCard=null;
const sampleCache=new Map();
const cleanName=s=>String(s||'').normalize('NFKD').toLowerCase().replace(/[\u0300-\u036f]/g,'').replace(/[^\p{L}\p{N}]+/gu,' ').trim().replace(/\s+/g,' ');
// JSONP works when the single-file demo is opened from a local file on iOS/Android.
function appleSearch(term,limit=16,country='US'){
 const cacheKey=term+'|'+limit+'|'+country;
 if(sampleCache.has(cacheKey))return sampleCache.get(cacheKey);
 const task=new Promise(resolve=>{
  const callback='__betaApple_'+(++jsonpSequence)+'_'+Date.now();
  const script=document.createElement('script');let done=false;
  const finish=(data)=>{if(done)return;done=true;clearTimeout(timer);delete window[callback];script.remove();resolve(Array.isArray(data?.results)?data.results:[])};
  window[callback]=finish;
  script.async=true;script.src='https://itunes.apple.com/search?media=music&entity=song&country='+encodeURIComponent(country)+'&limit='+limit+'&term='+encodeURIComponent(term)+'&callback='+callback;
  script.onerror=()=>finish(null);
  const timer=setTimeout(()=>finish(null),5000);
  document.head.append(script);
 });
 sampleCache.set(cacheKey,task);
 task.then(rows=>{if(!rows.length)sampleCache.delete(cacheKey)});
 return task;
}
function matchSample(title,artist,rows){
 const want=cleanName(title),artistWant=cleanName(artist),firstArtist=cleanName(artist.split(/\s+(?:&|and|feat\.?|ft\.?)\s+|,/i)[0]);
 let best=null,bestScore=0;
 for(const r of rows){
  if(!r||r.kind!=='song'||!r.previewUrl)continue;
  const found=cleanName(r.trackName),act=cleanName(r.artistName);
  const titleOK=found===want||found.startsWith(want+' ')||want.startsWith(found+' ');
  const artistOK=act===artistWant||act.includes(firstArtist)&&firstArtist.length>=3||artistWant.includes(act)&&act.length>=4;
  if(!titleOK||!artistOK)continue;
  const score=(found===want?12:6)+(act===artistWant?7:3);
  if(score>bestScore){best=r;bestScore=score}
 }
 return best;
}
function setPreviewPlayingUI(){previewBtn.textContent=audioSample.paused?'▶':'Ⅱ';previewBtn.setAttribute('aria-label',audioSample.paused?'Воспроизвести фрагмент':'Приостановить фрагмент')}
function pauseSample(){playbackGeneration++;audioSample.pause();clearTimeout(clipTimer);clipTimer=null;setPreviewPlayingUI()}
function closePreview(){hideTrackDetail();previewToken++;pauseSample();audioSample.removeAttribute('src');audioSample.load();currentPreview=null;betaPreview.classList.remove('open');root.classList.remove('previewing');previewProgress.style.width='0%';previewLink.style.display='none'}
function playAvailableSample(){
 if(!currentPreview?.url)return;
 if(audioSample.src!==currentPreview.url){audioSample.src=currentPreview.url;audioSample.load()}
 if(!audioSample.paused){pauseSample();previewNote.textContent='На паузе · 9 секунд';return}
 if(audioSample.currentTime>=PREVIEW_SECONDS-.3)audioSample.currentTime=0;
 const generation=++playbackGeneration,token=previewToken;
 const attempt=audioSample.play();
 Promise.resolve(attempt).then(()=>{
  if(token!==previewToken||generation!==playbackGeneration||audioSample.paused||!currentPreview)return;
  clipStarted=audioSample.currentTime;
  previewNote.textContent='Играет фрагмент · '+((currentPreview.source==='iTunes'?'courtesy of iTunes':currentPreview.source||'музыкальный каталог'));
  setPreviewPlayingUI();clearTimeout(clipTimer);
  clipTimer=setTimeout(()=>{
   if(generation!==playbackGeneration||token!==previewToken)return;
   pauseSample();audioSample.currentTime=0;previewProgress.style.width='100%';previewNote.textContent='Фрагмент закончен · 9 секунд';
  },PREVIEW_SECONDS*1000);
 }).catch(()=>{
  if(token!==previewToken||generation!==playbackGeneration)return;
  setPreviewPlayingUI();previewNote.textContent='Нажми ▶ · браузер мог запретить автозапуск';
 });
}
async function deezerSearch(song){
 try{
  const url='/_api/music-preview?title='+encodeURIComponent(song.title)+'&artist='+encodeURIComponent(song.artist);
  const res=await fetch(url,{signal:AbortSignal.timeout(7000),cache:'no-store'});
  if(!res.ok)return null;
  const data=await res.json();
  if(data?.ok&&typeof data.preview==='string'&&/^https:\/\/[a-z0-9.-]*dzcdn\.net\//i.test(data.preview))
   return {url:data.preview,page:data.page,source:'Deezer'};
 }catch(_){/* An alternate catalog may still have a matching sample. */}
 return null;
}
async function itunesSearch(song){
 const russian=/[\u0400-\u04FF]/.test(song.title+' '+song.artist);
 const countries=russian?['RU','US']:['US','GB'];
 const batches=await Promise.all(countries.map(country=>appleSearch(song.title+' '+song.artist,18,country)));
 for(const rows of batches){
  const result=matchSample(song.title,song.artist,rows);
  if(result){
   const url=result.previewUrl?.replace(/^http:/,'https:');
   if(/^https:\/\//.test(url))return {url,page:result.trackViewUrl||null,source:'iTunes'};
  }
 }
 return null;
}
function findFirstRealPreview(song){
 return new Promise(resolve=>{
  let pending=2,done=false;
  const settle=(match)=>{if(match&&!done){done=true;resolve(match)}else if(!--pending&&!done){done=true;resolve(null)}};
  Promise.resolve().then(()=>deezerSearch(song)).then(settle,()=>settle(null));
  Promise.resolve().then(()=>itunesSearch(song)).then(settle,()=>settle(null));
 });
}
async function startPreviewSong(song,autoPlay=true){
 hideTrackDetail();const token=++previewToken;pauseSample();audioSample.removeAttribute('src');audioSample.load();
 currentPreview={...song,url:null,source:null};
 root.classList.add('previewing');betaPreview.classList.add('open');previewTitle.textContent=song.title+' · '+song.artist;
 previewNote.textContent='Проверяем доступные фрагменты · нажми на название для похожих';previewBtn.disabled=true;previewBtn.textContent='…';previewProgress.style.width='0%';previewLink.style.display='none';
 soundcloudLink.href='https://soundcloud.com/search/sounds?q='+encodeURIComponent(song.artist+' '+song.title);
 try{
  const found=await findFirstRealPreview(song);
  if(token!==previewToken)return;
  if(!found){previewNote.textContent='Превью недоступно · проверь другие версии в SoundCloud ↗';previewBtn.disabled=true;previewBtn.textContent='—';return}
  currentPreview.url=found.url;currentPreview.source=found.source;
  if(/^https:\/\//.test(found.page||'')){
   previewLink.href=found.page;previewLink.textContent='Открыть в '+found.source;previewLink.style.display='block';
  }
  previewBtn.disabled=false;previewBtn.textContent='▶';
  previewNote.textContent='9 секунд · '+found.source+' · нажми на название для похожих';
  if(autoPlay)playAvailableSample();
 }catch(err){if(token!==previewToken)return;previewNote.textContent='Каталоги недоступны · попробуй SoundCloud ↗';previewBtn.disabled=true;previewBtn.textContent='—'}
}

   const k=progress*progress*(3-2*progress);
   const radialX=baseX-c.x,radialY=baseY-c.y;
   const rad=Math.max(1,Math.hypot(radialX,radialY));
   const offset=Math.min(38,rad*.32);
   x=baseX-radialX/rad*offset*(1-k);
   y=baseY-radialY/rad*offset*(1-k);
   scale=.72+.28*k;
   alpha=S(progress*1.95);
   blur=(1-k)*2.4;
   if(progress>=1){obj.phase='idle';obj.safeX=x;obj.safeY=y}
  }else if(obj.phase==='exit'){
   const k=C((now-obj.phaseTime)/390,0,1);
   // Retiring labels softly contract at their own coordinates, not into the core.
   x=obj.exitX;y=obj.exitY;scale=1-.22*ease(k);alpha=1-ease(k);blur=k*2.5;
   if(k>=1){obj.el.remove();liveTags.delete(key);places.delete(key);continue}
  }
  if(obj.phase==='idle'){
   if(obj.safeX==null){obj.safeX=baseX;obj.safeY=baseY}
   obj.safeX+=c.x-(obj.lastCoreX??c.x);obj.safeY+=c.y-(obj.lastCoreY??c.y);
   const follow=Math.min(1,dt*.72);
   obj.safeX+=(baseX+floatX-obj.safeX)*follow;
   obj.safeY+=(baseY+floatY-obj.safeY)*follow;
   x=obj.safeX;y=obj.safeY;
  }
  obj.lastCoreX=c.x;obj.lastCoreY=c.y;
  if(!obj.measuredW){obj.measuredW=obj.el.offsetWidth||p.w;obj.measuredH=obj.el.offsetHeight||p.h;}
  visuals.push({obj,x,y,scale,alpha,c,w:obj.measuredW,h:obj.measuredH,stable:obj.phase==='idle'});
 }
 // Labels float in their own zones, but cannot cover other labels.
 // Resolving only the UI avoids changing the original liquid-metal simulation.
 const visible=visuals.filter(v=>v.alpha>.68&&v.obj.phase!=='exit');
 function bound(v){
  const pad=8,minY=Math.max(92,H*.145)+v.h*.5,maxY=H-(W<620?Math.max(180,H*.22):Math.max(103,H*.155))-v.h*.5;
  v.x=C(v.x,v.w*.5+pad,Math.max(v.w*.5+pad,W-v.w*.5-pad));
  v.y=C(v.y,minY,Math.max(minY,maxY));
  const z=zone(v.obj.owner),range=Math.max(15,z.r-Math.hypot(v.w*.5,v.h*.5)-6);
  const dx=v.x-v.c.x,dy=v.y-v.c.y,r=Math.hypot(dx,dy);
  if(r>range){v.x=v.c.x+dx*range/r;v.y=v.c.y+dy*range/r}
  v.x=C(v.x,v.w*.5+pad,Math.max(v.w*.5+pad,W-v.w*.5-pad));
  v.y=C(v.y,minY,Math.max(minY,maxY));
 }
 for(const v of visible)if(v.stable)bound(v);
 for(let pass=0;pass<12;pass++){
  let collisions=0;
  for(let i=0;i<visible.length;i++)for(let j=i+1;j<visible.length;j++){
   const a=visible[i],b=visible[j];
   if(!a.stable||!b.stable)continue;
   const overlapX=(a.w*a.scale+b.w*b.scale)*.5+8-Math.abs(a.x-b.x);
   const overlapY=(a.h*a.scale+b.h*b.scale)*.5+8-Math.abs(a.y-b.y);
   if(overlapX<=0||overlapY<=0)continue;
   collisions++;
   const dx=Math.sign(a.x-b.x)||((i+j)%2?1:-1),dy=Math.sign(a.y-b.y)||((i+j)%2?-1:1);
   const aShare=a.stable?(b.stable?.5:1):0,bShare=b.stable?(a.stable?.5:1):0;
   if(overlapX<overlapY*1.2){a.x+=dx*overlapX*aShare*1.05;b.x-=dx*overlapX*bShare*1.05}
   else{a.y+=dy*overlapY*aShare*1.05;b.y-=dy*overlapY*bShare*1.05}
  }
  for(const v of visible)if(v.stable)bound(v);
  if(!collisions)break;
 }
 // Entering labels travel out of a core. Temporarily fade them behind an
 // existing label rather than drawing one readable title on top of another.
 // This affects label opacity ONLY, not WebGL particles or any core physics.
 const occupied=[];
 for(const v of [...visuals].sort((a,b)=>Number(b.stable)-Number(a.stable))){
  if(v.alpha<.65||v.obj.phase==='exit')continue;
  const conflicting=occupied.some(u=>
   Math.abs(v.x-u.x)<(v.w*v.scale+u.w*u.scale)*.5+3 &&
   Math.abs(v.y-u.y)<(v.h*v.scale+u.h*u.scale)*.5+3);
  const desired=conflicting?0:1;
  v.obj.occlusion=(v.obj.occlusion??0)+(desired-(v.obj.occlusion??0))*Math.min(1,dt*13);
  v.alpha*=v.obj.occlusion;
  if(!conflicting)occupied.push(v);
 }
 for(const v of visuals){
  const {obj,x,y,scale,alpha}=v;
  obj.lastX=x;obj.lastY=y;
  if(v.stable){obj.safeX=x;obj.safeY=y}
  // Keep the visual ripple, but don't force the browser to repaint every label
  // for subpixel motion or re-rasterize dynamic CSS filters over WebGL.
  const px=Math.round(x),py=Math.round(y),sc=Math.round(scale*1000);
  if(obj.drawX!==px||obj.drawY!==py||obj.drawScale!==sc){
   obj.el.style.transform=`translate3d(${px}px,${py}px,0) translate(-50%,-50%) scale(${(sc/1000).toFixed(3)})`;
   obj.drawX=px;obj.drawY=py;obj.drawScale=sc;
  }
  const opacity=Math.round(alpha*1000);
  if(obj.drawAlpha!==opacity){obj.el.style.opacity=(opacity/1000).toFixed(3);obj.drawAlpha=opacity;}
  const interactive=alpha>.7&&obj.phase!=='exit';
  if(obj.drawInteractive!==interactive){obj.el.style.pointerEvents=interactive?'auto':'none';obj.drawInteractive=interactive;}
 }
}
