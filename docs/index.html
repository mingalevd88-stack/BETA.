/* === BETA LIQUID · futuristic button refinement === */
:root{

}
button{
 transition:transform .18s ease,background .22s ease,border-color .22s ease,box-shadow .22s ease,color .22s ease,opacity .22s ease;
}
button:not(:disabled):hover{transform:translateY(-1px)}
button:not(:disabled):active{transform:translateY(0) scale(.97)}

 position:relative;
 overflow:hidden;
}

 content:"";
 position:absolute;
 inset:1px;
 border-radius:inherit;
 background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,0) 42%);
 pointer-events:none;
 opacity:.9;

}
.bottom-nav button{

}
.icon-btn,.profile{

}
.icon-btn:hover,.profile:hover{

.profile{

}
.pill{

}
.primary,.secondary,.mood,.chip,.tab,.eq-presets button,.song-card .card-play,.p-controls .toggle,.np-ctrl .big-play{
 border-radius:999px;

}
.primary,.secondary{

 padding:11px 17px;
}
.primary{

}
.primary:hover{

.secondary{

}
.secondary:hover{

.text-button{

.text-button:hover{background:rgba(255,255,255,.05);color:#f4f7fb}
.mood,.chip,.tab,.eq-presets button{
 min-height:39px;
 padding:9px 14px;

 box-shadow:var(--btn-shadow-soft);
}
.mood:hover,.chip:hover,.tab:hover,.eq-presets button:hover{

 border-color:rgba(178,193,208,.34);
}
.mood.active,.tab.active,.chip.on,.eq-presets button.on{
 background:linear-gradient(180deg,rgba(55,65,82,.98),rgba(17,24,35,1));
 border-color:rgba(var(--accent-rgb),.66);
 color:#f7fbff;
 box-shadow:var(--btn-shadow-active);
}
.song-card .card-play,.p-controls .toggle,.np-ctrl .big-play{
 background:var(--btn-metal);
 border:1px solid var(--btn-border-strong);
 color:#f6f9fc;
 box-shadow:var(--btn-shadow-active);
}
.song-card .card-play:hover,.p-controls .toggle:hover,.np-ctrl .big-play:hover{

}
.song-card .card-play{

 height:38px;
}
.p-controls .toggle,.np-ctrl .big-play{

 height:62px;
}
.p-controls button:not(.toggle),.np-ctrl button:not(.big-play){
 width:44px;
 height:44px;
 border-radius:999px;
 border:1px solid rgba(123,136,150,.22);

 box-shadow:var(--btn-shadow-soft);
}
.p-controls button:not(.toggle):hover,.np-ctrl button:not(.big-play):hover{
 border-color:rgba(178,193,208,.34);
 color:#f5f8fc;
}
.switch{
 box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 8px 18px rgba(0,0,0,.22);
}
.search-box button,.dialog-actions button,.menu button,.import-zone button,.playlist-head button,.queue-item button,.track-actions button{
 border-radius:999px;
}
@media (max-width:660px){

function openDialog(title,message,placeholder,confirm,initial='',callback){const root=$('#dialogroot');root.innerHTML=`<form class="dialog" id="nameForm"><h3>${esc(title)}</h3><p>${esc(message)}</p><input type="text" maxlength="70" id="dialogInput" placeholder="${esc(placeholder)}" value="${esc(initial)}" required><div class="dialog-actions"><button type="button" class="secondary" data-action="dialog-close">Отмена</button><button type="submit" class="primary">${esc(confirm)}</button></div></form>`;root.classList.add('show');root._callback=callback;setTimeout(()=>$('#dialogInput')?.focus(),20)}
function closeDialog(){const e=$('#dialogroot');e.classList.remove('show');e._callback=null;e.innerHTML=''}
function createPlaylist(name){let p={id:'p:'+Date.now().toString(36)+':'+Math.random().toString(36).slice(2,5),name:name.trim(),ids:[]};if(!p.name)return null;state.playlists.push(p);saveSoon();if(state.view==='library')renderPage();toast('Плейлист создан');return p}
function playlistDialog(t){if(!state.playlists.length){openDialog('Новый плейлист','Создай плейлист — выбранный трек попадёт в него автоматически.','Название плейлиста','Создать','Мой плейлист',name=>{const p=createPlaylist(name);if(p&&t){p.ids.push(t.id);saveSoon()}});return}const root=$('#dialogroot');root.innerHTML=`<div class="dialog"><h3>Добавить в плейлист</h3><p>${esc(t?.title||'Выбери плейлист')}</p>${state.playlists.map(p=>`<button class="secondary" style="width:100%;justify-content:flex-start;margin-bottom:8px" data-action="playlist-add" data-id="${esc(p.id)}">${I('list')} ${esc(p.name)} · ${p.ids.length}</button>`).join('')}<div class="dialog-actions"><button class="secondary" data-action="dialog-close">Закрыть</button><button class="primary" data-action="playlist-create-and-add">${I('plus')} Новый</button></div></div>`;root.classList.add('show');root._track=t}
async function deleteLocal(t){if(!t||t.source!=='local')return;const was=state.current?.id===t.id;if(was){++state.playToken;audioLocal.pause();state.current=null;state.playing=false;killObject()}await dbDel(t.id);known.delete(t.id);localFiles.delete(t.id);state.liked.delete(t.id);state.queue=state.queue.filter(x=>x.id!==t.id);state.playlists.forEach(p=>p.ids=p.ids.filter(id=>id!==t.id));state.pos=-1;saveSoon();renderAll();toast('Файл удалён только из Beta');}
document.addEventListener('click',async ev=>{const btn=ev.target.closest('[data-action]');if(!btn){if(!ev.target.closest('#trackmenu'))closeMenu();return}ev.preventDefault();ev.stopPropagation();const action=btn.dataset.action,id=btn.dataset.id,t=known.get(id),ix=Number(btn.dataset.index);
 switch(action){
 case 'nav':if(btn.dataset.view==='settings'&&state.view!=='settings')profileTab='profile';setView(btn.dataset.view);break;
 case 'settings':profileTab='profile';setView('settings');break;
 case 'id-studio-category':idStudioShow(btn.dataset.category);break;
 case 'id-studio-preset':idStudioPreset(btn.dataset.preset);break;
 case 'id-stage-motion':{const stage=btn.closest('.id-stage');stage.classList.remove('id-stage-motion');if(idMotionEnabled()){void btn.offsetWidth;stage.classList.add('id-stage-motion')}break;}
 case 'id-edit-profile':{idProfileEditing=!idProfileEditing;const editor=$('.id-profile-editor');if(editor){editor.hidden=!idProfileEditing;btn.setAttribute('aria-expanded',String(idProfileEditing));if(idProfileEditing&&idMotionEnabled())editor.animate([{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'none'}],{duration:settings.idDuration,easing:eases[settings.idEase]})}break;}
 case 'id-profile-photo':{const k=btn.dataset.kind;if(['avatar','cover'].includes(k))$('#id-'+k+'-file').click();break;}
 case 'id-profile-remove':{const k=btn.dataset.kind;if(['avatar','cover'].includes(k)){idProfile[k]='';idRefreshProfile();idSaveProfile()}break;}
 case 'id-profile-layout':if(['left','center'].includes(btn.dataset.layout)){idProfile.layout=btn.dataset.layout;idRefreshProfile();idSaveProfile()}break;
 case 'id-profile-done':{idProfileEditing=false;$('.id-profile-editor').hidden=true;$('.id-edit-profile').setAttribute('aria-expanded','false');toast(idSaveProfile()?'Профиль сохранён':'Не удалось сохранить профиль на устройстве');break;}
 case 'id-profile-tab':if(profileTab!==btn.dataset.tab){profileTab=btn.dataset.tab;renderPage()}break;
 case 'id-toggle':{const k=btn.dataset.key;if(['idLabels','idGlassNav','idSuggestions'].includes(k)){settings[k]=!settings[k];applyIdentity();saveSoon();btn.classList.toggle('on',settings[k]);btn.setAttribute('aria-checked',String(settings[k]))}break;}
 case 'id-motion-test':btn.style.setProperty('--id-distance',Math.max(0,btn.clientWidth-56)+'px');btn.classList.toggle('moved');btn.querySelector('span:last-child').textContent=btn.classList.contains('moved')?'Нажми ещё раз':'Проверить движение';break;
 case 'id-reset':{Object.assign(settings,idDefaults);applyIdentity();saveSoon();renderPage();toast('Параметры Identity сброшены');break;}
 case 'play':if(t)await playTrack(t);break;
 case 'toggle-play':case 'now-toggle':await togglePlay();break;
 case 'open-now':launchNow();break;
 case 'close-now':closeNow();break;
 case 'next':await nextTrack(true);break;
 case 'prev':prevTrack();break;
 case 'shuffle':settings.shuffle=!settings.shuffle;saveSoon();renderPlayer();if(state.nowOpen)renderNow();break;
 case 'repeat':settings.repeat=settings.repeat==='off'?'all':settings.repeat==='all'?'one':'off';saveSoon();renderPlayer();if(state.nowOpen)renderNow();toast('Повтор: '+(settings.repeat==='off'?'выключен':settings.repeat==='all'?'всей очереди':'одного трека'));break;
 case 'like':if(t)toggleLike(t.id);break;
 case 'like-current':if(state.current)toggleLike(state.current.id);break;
 case 'queue':if(t)addQueue(t);break;
 case 'queue-current':if(state.current)addQueue(state.current);break;
 case 'queue-play':if(Number.isInteger(ix)&&state.queue[ix]){state.pos=ix;playTrack(state.queue[ix]);if(state.nowOpen&&state.nowTab==='queue')renderNow();}break;
 case 'remove-queue':removeQueue(ix);if(state.nowOpen&&state.nowTab==='queue')renderNow();break;
 case 'clear-queue':{state.queue=[];state.pos=-1;state.flow=false;saveSoon();renderQueue();if(state.view==='flow')renderPage();if(state.nowOpen)renderNow();toast('Очередь очищена');break;}
 case 'mute':setVolume(settings.volume>0?0:70);break;
 case 'import':$('#fileinput').click();break;
 case 'mood':state.mood=btn.dataset.mood;state.discover=[];renderPage();loadDiscover(true);break;
 case 'retry-discover':state.loading=false;loadDiscover(true);break;
 case 'search-suggest':startSearch(btn.dataset.query);break;
 case 'search-clear':startSearch('');break;
 case 'start-flow':startFlow();break;
 case 'stop-flow':stopFlow();break;
 case 'lib-tab':state.tab=btn.dataset.tab;state.collection=null;renderPage();break;
 case 'leave-collection':state.collection=null;state.tab='playlists';renderPage();break;
 case 'open-playlist':state.collection=btn.dataset.id;renderPage();break;
 case 'new-playlist':openDialog('Новый плейлист','Придумай название своей подборки.','Мой плейлист','Создать','',name=>createPlaylist(name));break;
 case 'wallpaper-pick':$('#wallpaperinput').click();break;
 case 'wallpaper-reset':wallpaper='';try{localStorage.removeItem('beta.signature.wallpaper')}catch{}applyWallpaper();toast('Фон сброшен');break;
 case 'theme':{const t=themes.find(t=>t.id===btn.dataset.themeId);if(t){settings.theme=t.id;settings.accent=t.accent;applySettings();saveSoon();renderAll();toast('Стиль: '+t.name)}break;}
 case 'accent':settings.accent=btn.dataset.color;applySettings();saveSoon();renderPage();break;
 case 'toggle-motion':settings.motion=!settings.motion;applySettings();if(!settings.motion){for(const a of idPageAnimations)a.cancel();idPageAnimations=[]}saveSoon();btn.classList.toggle('on',settings.motion);btn.setAttribute('aria-checked',String(settings.motion));break;
 case 'open-eq':launchNow('eq');break;
 case 'now-tab':state.nowTab=btn.dataset.tab;renderNow();if(state.nowTab==='lyrics')fetchLyrics();break;
 case 'search-artist':if(state.current){closeNow();startSearch(state.current.artist)}break;
 case 'import-lrc':$('#lrcinput').click();break;
 case 'eq-preset':selectEQ(btn.dataset.value);break;
 case 'menu':if(t)openMenu(t,btn);break;
 case 'menu-current':if(state.current)openMenu(state.current,btn);break;
 case 'menu-play':if(state.context){const track=state.context;closeMenu();playTrack(track)}break;
 case 'menu-queue':if(state.context){const track=state.context;closeMenu();addQueue(track)}break;
 case 'menu-like':if(state.context){const track=state.context;closeMenu();toggleLike(track.id)}break;
 case 'menu-playlist':if(state.context){const track=state.context;closeMenu();playlistDialog(track)}break;
 case 'menu-artist':if(state.context){const artist=state.context.artist;closeMenu();closeNow();startSearch(artist)}break;
 case 'menu-delete':if(state.context){const track=state.context;closeMenu();if(confirm('Удалить «'+track.title+'» из хранилища Beta? Исходный файл на телефоне останется.'))await deleteLocal(track)}break;
 case 'dialog-close':closeDialog();break;
 case 'playlist-add':{const p=state.playlists.find(x=>x.id===id),track=$('#dialogroot')._track;if(p&&track){if(!p.ids.includes(track.id))p.ids.push(track.id);saveSoon();toast('Добавлено в «'+p.name+'»')}closeDialog();if(state.view==='library')renderPage();break;}
 case 'playlist-create-and-add':{const track=$('#dialogroot')._track;closeDialog();openDialog('Новый плейлист','Название подборки','Название','Создать','',name=>{const p=createPlaylist(name);if(p&&track){p.ids.push(track.id);saveSoon()}});break;}
 default:break;
 }
});
document.addEventListener('input',e=>{const input=e.target;
 if(input.id==='id-profile-name'||input.id==='id-profile-bio'){if(input.id==='id-profile-name')idProfile.name=input.value.slice(0,40);else idProfile.bio=input.value.slice(0,150);idRefreshProfile();idSaveProfile();return}
 if(input.matches('[data-id-setting]')){const k=input.dataset.idSetting;if(input.type==='range')idSetRangeFill(input);if(idRanges[k]){const n=Number(input.value),r=idRanges[k];if(!Number.isFinite(n)||n<r[0]||n>r[1])return;settings[k]=n;const out=document.querySelector('[data-id-output="'+k+'"]');if(out)out.textContent=n+({idScale:'%',idGlass:'%',idDuration:' мс'}[k]||' px')}else if(idChoices[k]&&idChoices[k].includes(input.value))settings[k]=input.value;else if(k==='accent'&&/^#[0-9a-f]{6}$/i.test(input.value))settings.accent=input.value;else return;idQueueApply(k==='accent');saveSoon();return}
 if(input.id==='searchInput'){startSearch(input.value);return}
 if(input.matches('[data-timeline]')){const t=Math.max(0,Number(input.value)||0);if(Number.isFinite(activeAudio.duration)&&t<=activeAudio.duration)activeAudio.currentTime=t;updateTimeUI();return}
 if(input.matches('[data-volume]')){settings.volume=Number(input.value);audioLocal.volume=audioRemote.volume=settings.volume/100;input.style.setProperty('--value',settings.volume+'%');saveSoon();return}
 if(input.matches('[data-eq]')){const index=Number(input.dataset.eq);if(index>=0&&index<3){settings.eq[index]=Number(input.value);settings.eqPreset='custom';input.style.setProperty('--value',((settings.eq[index]+12)/24*100)+'%');input.parentElement.querySelector('span').textContent=(settings.eq[index]>0?'+':'')+settings.eq[index]+' dB';applyEQ();saveSoon()}return}
 if(input.matches('[data-setting]')){const key=input.dataset.setting;if(input.type==='range'){idSetRangeFill(input);const out=input.closest('.id-control')?.querySelector('.id-legacy-value');if(out)out.textContent=input.value+(key==='sidebar'?' px':'%')}if(key==='speed'){settings.speed=Number(input.value);audioRemote.playbackRate=audioLocal.playbackRate=settings.speed}else if(key==='glow'){settings.glow=Number(input.value)}else if(key==='wallDark'){settings.wallDark=Number(input.value)}else if(key==='sidebar')settings.sidebar=Number(input.value);idQueueApply(true);saveSoon();return}
});
document.addEventListener('change',e=>{const input=e.target;if(input.matches('[data-volume]'))renderPlayer();});
$('#wallpaperinput').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;let url=URL.createObjectURL(f);try{let im=new Image();im.src=url;await im.decode();const k=Math.min(1,1400/Math.max(im.width,im.height));let c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);wallpaper=c.toDataURL('image/jpeg',.82);applyWallpaper();try{localStorage.setItem('beta.signature.wallpaper',wallpaper);toast('Фон изменён')}catch{toast('Фон установлен до закрытия страницы')}}catch{toast('Не удалось открыть фотографию')}finally{URL.revokeObjectURL(url);e.target.value=''}});
$('#fileinput').addEventListener('change',e=>{importFiles([...e.target.files]);e.target.value=''});
$('#lrcinput').addEventListener('change',async e=>{const f=e.target.files?.[0],t=activeSong();if(!f||!t)return;try{const content=await f.text(),synced=parseLrc(content);state.lyrics={type:'found',text:content,synced};state.lyricsFor=t.id;state.lastLyricIndex=-1;if(state.nowOpen){renderNow();highlightLyrics(activeAudio.currentTime||0)}toast('Текст песни загружен')}catch{toast('Не удалось открыть текст')}e.target.value=''});
$('#dialogroot').addEventListener('submit',e=>{e.preventDefault();const root=$('#dialogroot');const v=$('#dialogInput')?.value?.trim();if(v&&typeof root._callback==='function'){const cb=root._callback;closeDialog();cb(v)}});
$('#dialogroot').addEventListener('click',e=>{if(e.target===$('#dialogroot'))closeDialog()});
document.addEventListener('keydown',e=>{const t=e.target;if(idDialog.open)return;const editing=t instanceof HTMLInputElement||t instanceof HTMLTextAreaElement||t instanceof HTMLSelectElement;if(e.key==='Escape'){closeNow();closeMenu();closeDialog();return}if(editing)return;if(e.code==='Space'&&!t.closest('button,a,[role=button]')){e.preventDefault();togglePlay()}if(e.key==='ArrowRight'&&e.altKey){e.preventDefault();nextTrack(true)}if(e.key==='ArrowLeft'&&e.altKey){e.preventDefault();prevTrack()}if(e.key==='Enter'){const target=document.activeElement;if(target?.dataset.action&&!target.matches('button,a,input,select,textarea')){e.preventDefault();target.click()}}});
window.addEventListener('beforeunload',killObject);
applySettings();(async()=>{await hydrateFiles();renderAll();loadDiscover();})();
window.__betaPlayerDebug=()=>({view:state.view,playing:state.playing,current:state.current?.title||null,queue:state.queue.length,liked:state.liked.size,imported:localFiles.size,nowOpen:state.nowOpen,flow:state.flow,ready:true});
})();
</script></body></html>
